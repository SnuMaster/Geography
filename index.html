<script>
const SUPABASE_URL = 'https://aplhddasduwtlxeejvnk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwbGhkZGFzZHV3dGx4ZWVqdm5rIiwicm9sZSI6ImFwbGhkZGFzZHV3dGx4ZWVqdm5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3Njc3NzYsImV4cCI6MjEwMjM0Mzc2OX0.SOCnDGVzstFyD5NPreZDe2uuRFvcYwEZiQKlYYQ6LF0';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const places = [
  ["서울", 37.5665, 126.9780], ["제주", 33.4996, 126.5312], ["부산", 35.1796, 129.0756],
  ["대구", 35.8714, 128.6014], ["강릉", 37.7519, 128.8761], ["독도", 37.2429, 131.8657],
  ["마라도", 33.1180, 126.2679], ["백령도", 37.9677, 124.6303]
];

const map = L.map('map', { zoomControl: true }).setView([38.25, 127.5], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const graticule = L.layerGroup().addTo(map);

for (let lat = 33; lat <= 43; lat++) {
  L.polyline([[lat, 124], [lat, 132]], {
    color:'#2f70a8',
    weight:1,
    opacity:.5,
    dashArray:'5 7'
  }).bindTooltip('북위 ' + lat + '°', {
    permanent:true,
    direction:'left',
    className:'coord-label'
  }).addTo(graticule);
}

for (let lng = 125; lng <= 131; lng++) {
  L.polyline([[32.7, lng], [44, lng]], {
    color:'#2f70a8',
    weight:1,
    opacity:.35,
    dashArray:'5 7'
  }).addTo(graticule);
}

let marker, quizAnswer, currentUser, quizCount = 0, bestDistanceKm = null;
const $ = id => document.getElementById(id);

function pin(lat, lng, label = '내 핀') {
  if (lat < 32 || lat > 44 || lng < 124 || lng > 132) {
    $('notice').textContent = '한반도 주변 범위(북위 32~44°, 동경 124~132°)에서 입력해줘.';
    return false;
  }

  if (marker) marker.remove();

  marker = L.marker([lat, lng])
    .addTo(map)
    .bindPopup(`<b>${label}</b><br>북위 ${lat.toFixed(4)}°, 동경 ${lng.toFixed(4)}°`)
    .openPopup();

  $('lat').value = lat.toFixed(4);
  $('lng').value = lng.toFixed(4);
  $('notice').textContent = `${label}: 북위 ${lat.toFixed(4)}°, 동경 ${lng.toFixed(4)}°`;

  saveProgress();
  return true;
}

$('pinBtn').onclick = () => {
  const a = Number($('lat').value);
  const b = Number($('lng').value);

  if (pin(a, b)) {
    map.setView([a, b], Math.max(map.getZoom(), 9));
  }
};

$('clearBtn').onclick = () => {
  if (marker) marker.remove();
  marker = null;
  $('notice').textContent = '핀을 지웠어.';
};

map.on('click', e => pin(e.latlng.lat, e.latlng.lng));

places.forEach(([name, lat, lng]) => {
  const b = document.createElement('button');
  b.textContent = name;

  b.onclick = () => {
    pin(lat, lng, name);
    map.setView([lat, lng], 9);
  };

  $('places').appendChild(b);
});

function distanceKm(a, b, c, d) {
  const r = 6371;
  const x = (c - a) * Math.PI / 180;
  const y = (d - b) * Math.PI / 180;
  const h =
    Math.sin(x / 2) ** 2 +
    Math.cos(a * Math.PI / 180) *
    Math.cos(c * Math.PI / 180) *
    Math.sin(y / 2) ** 2;

  return 2 * r * Math.asin(Math.sqrt(h));
}

$('quizBtn').onclick = () => {
  quizAnswer = places[Math.floor(Math.random() * places.length)];
  $('target').textContent = `“${quizAnswer[0]}”의 위치를 지도에 찍어봐!`;
  $('quizResult').textContent = '';
  $('checkBtn').disabled = false;

  if (marker) {
    marker.remove();
    marker = null;
  }
};

$('checkBtn').onclick = () => {
  if (!quizAnswer || !marker) {
    $('quizResult').textContent = '먼저 지도 위에 핀을 찍어줘!';
    return;
  }

  const p = marker.getLatLng();
  const km = distanceKm(p.lat, p.lng, quizAnswer[1], quizAnswer[2]);

  const msg =
    km < 20 ? '완벽해!' :
    km < 70 ? '아주 가까워!' :
    km < 150 ? '괜찮아, 위도·경도선을 다시 봐봐.' :
    '조금 멀어. 정답 위치를 확인해봐.';

  quizCount++;
  bestDistanceKm = bestDistanceKm === null ? km : Math.min(bestDistanceKm, km);

  saveProgress();

  $('quizResult').textContent = `정답과 약 ${Math.round(km)}km 차이 — ${msg}`;

  L.circleMarker([quizAnswer[1], quizAnswer[2]], {
    radius: 9,
    color: '#14804a',
    fillColor: '#14804a',
    fillOpacity: .75
  }).addTo(map).bindPopup(`정답: ${quizAnswer[0]}`).openPopup();
};

function updateAccount() {
  $('loginBtn').hidden = Boolean(currentUser);
  $('logoutBtn').hidden = !currentUser;
  $('email').hidden = Boolean(currentUser);

  $('account').textContent = currentUser
    ? `${currentUser.email}로 로그인됨 · 마지막 핀과 퀴즈 기록이 자동 저장돼.`
    : '로그인하면 마지막 핀과 퀴즈 기록이 다른 기기에도 저장돼.';
}

async function saveProgress() {
  if (!currentUser || !marker) return;

  const point = marker.getLatLng();

  const { error } = await supabaseClient
    .from('study_progress')
    .upsert({
      user_id: currentUser.id,
      last_lat: point.lat,
      last_lng: point.lng,
      quiz_count: quizCount,
      best_distance_km: bestDistanceKm,
      updated_at: new Date().toISOString()
    });

  if (error) console.warn('기록 저장 실패:', error.message);
}

async function loadProgress() {
  if (!currentUser) return;

  const { data, error } = await supabaseClient
    .from('study_progress')
    .select('*')
    .eq('user_id', currentUser.id)
    .maybeSingle();

  if (!error && data) {
    quizCount = data.quiz_count || 0;
    bestDistanceKm = data.best_distance_km;

    if (data.last_lat && data.last_lng) {
      pin(Number(data.last_lat), Number(data.last_lng), '저장된 마지막 핀');
      map.setView([data.last_lat, data.last_lng], 9);
    }
  }
}

$('loginBtn').onclick = async () => {
  const email = $('email').value.trim();

  if (!email) {
    $('account').textContent = '이메일 주소를 입력해줘.';
    return;
  }

  $('account').textContent = '로그인 링크 전송 중...';

  const { error } = await supabaseClient.auth.signInWithOtp({
    email,
    options: {
      emailRedirectTo: window.location.href
    }
  });

  $('account').textContent = error
    ? `로그인 링크 전송 실패: ${error.message}`
    : '메일함에서 로그인 링크를 눌러줘. 아이패드와 컴퓨터에서 같은 이메일을 쓰면 돼.';
};

$('logoutBtn').onclick = async () => {
  await supabaseClient.auth.signOut();
  location.reload();
};

supabaseClient.auth.onAuthStateChange(async (_event, session) => {
  currentUser = session?.user;
  updateAccount();

  if (currentUser) {
    await loadProgress();
  }
});
</script>
