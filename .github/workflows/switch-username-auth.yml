name: Switch to username auth

on:
  push:
    paths:
      - '.github/workflows/switch-username-auth.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch username auth
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''        <label for="email">이메일</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email">
        <label for="password">비밀번호</label><input id="password" type="password" placeholder="6자 이상" autocomplete="current-password" minlength="6">
        <div class="row"><button id="loginBtn">로그인</button><button id="signupBtn" class="secondary">회원가입</button><button id="logoutBtn" class="secondary" hidden>로그아웃</button></div>'''
          new = '''        <label id="usernameLabel" for="username">아이디</label><input id="username" type="text" placeholder="영문 소문자·숫자 3~24자" autocomplete="username" minlength="3" maxlength="24" autocapitalize="none" spellcheck="false">
        <label id="passwordLabel" for="password">비밀번호</label><input id="password" type="password" placeholder="6자 이상" autocomplete="current-password" minlength="6">
        <div class="row"><button id="loginBtn">로그인</button><button id="signupBtn" class="secondary">회원가입</button><button id="logoutBtn" class="secondary" hidden>로그아웃</button></div>'''
          if old not in s: raise SystemExit('auth form block not found')
          s = s.replace(old, new, 1)

          old = '''      $('loginBtn').hidden = loggedIn;
      $('signupBtn').hidden = loggedIn;
      $('logoutBtn').hidden = !loggedIn;
      $('email').hidden = loggedIn;
      $('password').hidden = loggedIn;
      $('syncTools').hidden = !loggedIn;

      $('account').textContent = loggedIn
        ? currentUser.email + '로 로그인됨 · 모든 기기에서 같은 기록을 사용해.'
        : '로그인하면 마지막 핀과 퀴즈 기록이 다른 기기에도 저장돼.';'''
          new = '''      $('loginBtn').hidden = loggedIn;
      $('signupBtn').hidden = loggedIn;
      $('logoutBtn').hidden = !loggedIn;
      $('username').hidden = loggedIn;
      $('password').hidden = loggedIn;
      $('usernameLabel').hidden = loggedIn;
      $('passwordLabel').hidden = loggedIn;
      $('syncTools').hidden = !loggedIn;

      const displayUsername = loggedIn && currentUser.email
        ? currentUser.email.split('@')[0]
        : '';
      $('account').textContent = loggedIn
        ? displayUsername + ' 아이디로 로그인됨 · 모든 기기에서 같은 기록을 사용해.'
        : '아이디와 비밀번호로 로그인하면 모든 기기에서 같은 기록을 사용해.';'''
          if old not in s: raise SystemExit('updateAccount block not found')
          s = s.replace(old, new, 1)

          old = '''    $('loginBtn').onclick = async () => {
      const email = $('email').value.trim();
      const password = $('password').value;
      if (!email || !password) {
        $('account').textContent = '이메일과 비밀번호를 둘 다 입력해줘.';
        return;
      }
      $('account').textContent = '로그인 중…';
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      $('account').textContent = error ? '로그인 실패: ' + error.message : '로그인 완료 · 기록을 불러오는 중이야.';
    };

    $('signupBtn').onclick = async () => {
      const email = $('email').value.trim();
      const password = $('password').value;
      if (!email || !password) {
        $('account').textContent = '이메일과 비밀번호를 둘 다 입력해줘.';
        return;
      }
      if (password.length < 6) {
        $('account').textContent = '비밀번호는 6자 이상으로 만들어줘.';
        return;
      }
      $('account').textContent = '회원가입 중…';
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if (error) {
        $('account').textContent = '회원가입 실패: ' + error.message;
        return;
      }
      $('account').textContent = data.session ? '회원가입 완료 · 바로 로그인됐어.' : '회원가입은 됐지만 이메일 확인 설정이 켜져 있어. 관리자 설정에서 Confirm email을 꺼줘.';
    };'''
          new = '''    function getUsernameCredentials() {
      const username = $('username').value.trim().toLowerCase();
      const password = $('password').value;
      if (!username || !password) {
        return { error: '아이디와 비밀번호를 둘 다 입력해줘.' };
      }
      if (!/^[a-z0-9._-]{3,24}$/.test(username)) {
        return { error: '아이디는 영문 소문자, 숫자, 점(.), 밑줄(_), 하이픈(-)만 써서 3~24자로 만들어줘.' };
      }
      if (password.length < 6) {
        return { error: '비밀번호는 6자 이상으로 만들어줘.' };
      }
      return { username, password, email: username + '@users.korgeo.app' };
    }

    $('loginBtn').onclick = async () => {
      const credentials = getUsernameCredentials();
      if (credentials.error) {
        $('account').textContent = credentials.error;
        return;
      }
      $('account').textContent = '로그인 중…';
      const { error } = await supabaseClient.auth.signInWithPassword({
        email: credentials.email,
        password: credentials.password
      });
      $('account').textContent = error
        ? '로그인 실패 · 아이디 또는 비밀번호를 확인해줘.'
        : '로그인 완료 · 기록을 불러오는 중이야.';
    };

    $('signupBtn').onclick = async () => {
      const credentials = getUsernameCredentials();
      if (credentials.error) {
        $('account').textContent = credentials.error;
        return;
      }
      $('account').textContent = '회원가입 중…';
      const { data, error } = await supabaseClient.auth.signUp({
        email: credentials.email,
        password: credentials.password,
        options: { data: { username: credentials.username } }
      });
      if (error) {
        const duplicate = /already|registered|exists/i.test(error.message || '');
        $('account').textContent = duplicate
          ? '이미 사용 중인 아이디야. 다른 아이디를 골라줘.'
          : '회원가입 실패: ' + error.message;
        return;
      }
      $('account').textContent = data.session
        ? '회원가입 완료 · ' + credentials.username + ' 아이디로 바로 로그인됐어.'
        : '회원가입은 됐지만 로그인 세션이 만들어지지 않았어. Supabase의 Confirm email 설정이 꺼져 있는지 확인해줘.';
    };'''
          if old not in s: raise SystemExit('password auth handler block not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Bump service worker cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('service-worker.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("geography-app-v19", "geography-app-v20")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "Switch login to username and password"
          git push

# trigger 2
