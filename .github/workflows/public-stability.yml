name: Public stability patch
on:
  push:
    paths:
      - '.github/workflows/public-stability.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reduce fallback polling and bump cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='const FALLBACK_SYNC_INTERVAL_MS = 2000;'
          if old in s:
              s=s.replace(old,'const FALLBACK_SYNC_INTERVAL_MS = 15000;',1)
              p.write_text(s,encoding='utf-8')
          sw=Path('service-worker.js')
          t=sw.read_text(encoding='utf-8')
          import re
          t=re.sub(r"const APP_CACHE = 'geography-app-v(\d+)';",lambda m: f"const APP_CACHE = 'geography-app-v{int(m.group(1))+1}';",t,count=1)
          sw.write_text(t,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git diff --cached --quiet || git commit -m "Reduce fallback sync load for public traffic"
          git push
