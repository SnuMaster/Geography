name: Update password auth

on:
  push:
    paths:
      - '.github/workflows/update-password-auth.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_html = '''        <label for="email">이메일로 로그인</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email">
        <div class="row"><button id="loginBtn">로그인 링크 받기</button><button id="logoutBtn" class="secondary" hidden>로그아웃</button></div>'''
          new_html = '''        <label for="email">이메일</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email">
        <label for="password">비밀번호</label><input id="password" type="password" placeholder="6자 이상" autocomplete="current-password" minlength="6">
        <div class="row"><button id="loginBtn">로그인</button><button id="signupBtn" class="secondary">회원가입</button><button id="logoutBtn" class="secondary" hidden>로그아웃</button></div>'''
          if old_html not in s:
              raise SystemExit('auth html block not found')
          s = s.replace(old_html, new_html, 1)

          old_update = '''      $('loginBtn').hidden = loggedIn;
      $('logoutBtn').hidden = !loggedIn;
      $('email').hidden = loggedIn;
      $('syncTools').hidden = !loggedIn;'''
          new_update = '''      $('loginBtn').hidden = loggedIn;
      $('signupBtn').hidden = loggedIn;
      $('logoutBtn').hidden = !loggedIn;
      $('email').hidden = loggedIn;
      $('password').hidden = loggedIn;
      $('syncTools').hidden = !loggedIn;'''
          if old_update not in s:
              raise SystemExit('updateAccount block not found')
          s = s.replace(old_update, new_update, 1)

          old_login = '''    $('loginBtn').onclick = async () => {
      const email = $('email').value.trim();
      if (!email) {
        $('account').textContent = '이메일 주소를 입력해줘.';
        return;
      }

      $('account').textContent = '로그인 링크 전송 중…';
      const { error } = await supabaseClient.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: window.location.href }
      });

      $('account').textContent = error
        ? '로그인 링크 전송 실패: ' + error.message
        : '메일함에서 로그인 링크를 눌러줘. 같은 이메일로 로그인하면 모든 기기 기록이 이어져.';
    };'''
          new_login = '''    $('loginBtn').onclick = async () => {
      const email = $('email').value.trim();
      const password = $('password').value;
      if (!email || !password) {
        $('account').textContent = '이메일과 비밀번호를 둘 다 입력해줘.';
        return;
      }

      $('account').textContent = '로그인 중…';
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      $('account').textContent = error
        ? '로그인 실패: ' + error.message
        : '로그인 완료 · 기록을 불러오는 중이야.';
    };

    $('signupBtn').onclick = async () => {
      const email = $('email').value.trim();
      const password = $('password').value;
      if (!email || !password) {
        $('account').textContent = '이메일과 비밀번호를 둘 다 입력해줘.';
        return;
      }
      if (password.length < 6) {
        $('account').textContent = '비밀번호는 6자 이상으로 만들어줘.';
        return;
      }

      $('account').textContent = '회원가입 중…';
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if (error) {
        $('account').textContent = '회원가입 실패: ' + error.message;
        return;
      }
      $('account').textContent = data.session
        ? '회원가입 완료 · 바로 로그인됐어.'
        : '회원가입은 됐지만 이메일 확인 설정이 켜져 있어. 관리자 설정에서 Confirm email을 꺼줘.';
    };'''
          if old_login not in s:
              raise SystemExit('login handler block not found')
          s = s.replace(old_login, new_login, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Bump service worker cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('service-worker.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("geography-app-v10", "geography-app-v11")
          s = s.replace("geography-map-tiles-v10", "geography-map-tiles-v11")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes and remove updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/update-password-auth.yml
          git add index.html service-worker.js .github/workflows/update-password-auth.yml
          git commit -m "Switch auth to email and password"
          git push
