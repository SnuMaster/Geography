name: Update password auth

on:
  push:
    paths:
      - '.github/workflows/update-password-auth.yml'

permissions:
  contents: write

jobs:
  patch-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Patch repository through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request
          token=os.environ['GH_TOKEN']; repo=os.environ['REPO']; branch=os.environ['BRANCH']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'auth-updater'}
          def api(method,path,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request('https://api.github.com'+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req) as r: return json.load(r)
          def get(path):
              o=api('GET',f'/repos/{repo}/contents/{path}?ref={branch}')
              return base64.b64decode(o['content']).decode(),o['sha']
          def put(path,content,sha,msg):
              api('PUT',f'/repos/{repo}/contents/{path}',{'message':msg,'content':base64.b64encode(content.encode()).decode(),'sha':sha,'branch':branch})
          html,sha=get('index.html')
          a='''        <label for="email">이메일로 로그인</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email">\n        <div class="row"><button id="loginBtn">로그인 링크 받기</button><button id="logoutBtn" class="secondary" hidden>로그아웃</button></div>'''
          b='''        <label for="email">이메일</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email">\n        <label for="password">비밀번호</label><input id="password" type="password" placeholder="6자 이상" autocomplete="current-password" minlength="6">\n        <div class="row"><button id="loginBtn">로그인</button><button id="signupBtn" class="secondary">회원가입</button><button id="logoutBtn" class="secondary" hidden>로그아웃</button></div>'''
          html=html.replace(a,b,1)
          a='''      $('loginBtn').hidden = loggedIn;\n      $('logoutBtn').hidden = !loggedIn;\n      $('email').hidden = loggedIn;\n      $('syncTools').hidden = !loggedIn;'''
          b='''      $('loginBtn').hidden = loggedIn;\n      $('signupBtn').hidden = loggedIn;\n      $('logoutBtn').hidden = !loggedIn;\n      $('email').hidden = loggedIn;\n      $('password').hidden = loggedIn;\n      $('syncTools').hidden = !loggedIn;'''
          html=html.replace(a,b,1)
          old='''    $('loginBtn').onclick = async () => {\n      const email = $('email').value.trim();\n      if (!email) {\n        $('account').textContent = '이메일 주소를 입력해줘.';\n        return;\n      }\n\n      $('account').textContent = '로그인 링크 전송 중…';\n      const { error } = await supabaseClient.auth.signInWithOtp({\n        email,\n        options: { emailRedirectTo: window.location.href }\n      });\n\n      $('account').textContent = error\n        ? '로그인 링크 전송 실패: ' + error.message\n        : '메일함에서 로그인 링크를 눌러줘. 같은 이메일로 로그인하면 모든 기기 기록이 이어져.';\n    };'''
          new='''    $('loginBtn').onclick = async () => {\n      const email = $('email').value.trim();\n      const password = $('password').value;\n      if (!email || !password) {\n        $('account').textContent = '이메일과 비밀번호를 둘 다 입력해줘.';\n        return;\n      }\n      $('account').textContent = '로그인 중…';\n      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });\n      $('account').textContent = error ? '로그인 실패: ' + error.message : '로그인 완료 · 기록을 불러오는 중이야.';\n    };\n\n    $('signupBtn').onclick = async () => {\n      const email = $('email').value.trim();\n      const password = $('password').value;\n      if (!email || !password) {\n        $('account').textContent = '이메일과 비밀번호를 둘 다 입력해줘.';\n        return;\n      }\n      if (password.length < 6) {\n        $('account').textContent = '비밀번호는 6자 이상으로 만들어줘.';\n        return;\n      }\n      $('account').textContent = '회원가입 중…';\n      const { data, error } = await supabaseClient.auth.signUp({ email, password });\n      if (error) {\n        $('account').textContent = '회원가입 실패: ' + error.message;\n        return;\n      }\n      $('account').textContent = data.session ? '회원가입 완료 · 바로 로그인됐어.' : '회원가입은 됐지만 이메일 확인 설정이 켜져 있어. 관리자 설정에서 Confirm email을 꺼줘.';\n    };'''
          if old not in html: raise SystemExit('old login block not found')
          html=html.replace(old,new,1)
          put('index.html',html,sha,'Switch auth to email and password')
          sw,swsha=get('service-worker.js')
          sw=sw.replace('geography-app-v10','geography-app-v11').replace('geography-map-tiles-v10','geography-map-tiles-v11')
          put('service-worker.js',sw,swsha,'Refresh cache for password auth')
          PY