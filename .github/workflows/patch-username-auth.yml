name: Patch username auth

on:
  push:
    paths:
      - '.github/workflows/patch-username-auth.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch username auth
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='''        <label for="email">이메일</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email">
        <label for="password">비밀번호</label><input id="password" type="password" placeholder="6자 이상" autocomplete="current-password" minlength="6">'''
          new='''        <label for="username">아이디</label><input id="username" type="text" placeholder="예: snumaster" autocomplete="username" minlength="3" maxlength="24" autocapitalize="none" spellcheck="false">
        <label for="password">비밀번호</label><input id="password" type="password" placeholder="6자 이상" autocomplete="current-password" minlength="6">'''
          if old not in s: raise SystemExit('auth UI block not found')
          s=s.replace(old,new,1)

          old='''      $('email').hidden = loggedIn;
      $('password').hidden = loggedIn;'''
          new='''      $('username').hidden = loggedIn;
      $('password').hidden = loggedIn;'''
          if old not in s: raise SystemExit('updateAccount input block not found')
          s=s.replace(old,new,1)

          old="""      $('account').textContent = loggedIn
        ? currentUser.email + '로 로그인됨 · 모든 기기에서 같은 기록을 사용해.'
        : '로그인하면 마지막 핀과 퀴즈 기록이 다른 기기에도 저장돼.';"""
          new="""      const displayUsername = currentUser && currentUser.email
        ? currentUser.email.replace(/@users\\.korgeo\\.app$/i, '')
        : '';
      $('account').textContent = loggedIn
        ? displayUsername + '로 로그인됨 · 모든 기기에서 같은 기록을 사용해.'
        : '로그인하면 마지막 핀과 퀴즈 기록이 다른 기기에도 저장돼.';"""
          if old not in s: raise SystemExit('account label block not found')
          s=s.replace(old,new,1)

          start=s.index("    $('loginBtn').onclick = async () => {")
          end=s.index("\n\n    $('logoutBtn').onclick", start)
          replacement=r'''    function normalizeUsername(raw) {
      return String(raw || '').trim().toLowerCase();
    }

    function usernameError(username) {
      if (username.length < 3 || username.length > 24) return '아이디는 3~24자로 만들어줘.';
      if (!/^[a-z0-9._-]+$/.test(username)) return '아이디는 영문 소문자, 숫자, 점(.), 밑줄(_), 하이픈(-)만 사용할 수 있어.';
      if (/^[._-]|[._-]$/.test(username)) return '아이디의 처음과 끝에는 점, 밑줄, 하이픈을 쓸 수 없어.';
      return '';
    }

    function usernameToEmail(username) {
      return username + '@users.korgeo.app';
    }

    $('loginBtn').onclick = async () => {
      const username = normalizeUsername($('username').value);
      const password = $('password').value;
      const invalid = usernameError(username);
      if (invalid) {
        $('account').textContent = invalid;
        return;
      }
      if (!password) {
        $('account').textContent = '비밀번호를 입력해줘.';
        return;
      }
      $('account').textContent = '로그인 중…';
      const { error } = await supabaseClient.auth.signInWithPassword({
        email: usernameToEmail(username), password
      });
      $('account').textContent = error
        ? '로그인 실패 · 아이디 또는 비밀번호를 확인해줘.'
        : '로그인 완료 · 기록을 불러오는 중이야.';
    };

    $('signupBtn').onclick = async () => {
      const username = normalizeUsername($('username').value);
      const password = $('password').value;
      const invalid = usernameError(username);
      if (invalid) {
        $('account').textContent = invalid;
        return;
      }
      if (password.length < 6) {
        $('account').textContent = '비밀번호는 6자 이상으로 만들어줘.';
        return;
      }
      $('account').textContent = '회원가입 중…';
      const { data, error } = await supabaseClient.auth.signUp({
        email: usernameToEmail(username),
        password,
        options: { data: { username } }
      });
      if (error) {
        const duplicate = /already|registered|exists/i.test(error.message || '');
        $('account').textContent = duplicate
          ? '이미 사용 중인 아이디야.'
          : '회원가입 실패: ' + error.message;
        return;
      }
      $('account').textContent = data.session
        ? '회원가입 완료 · 바로 로그인됐어.'
        : '회원가입은 됐지만 이메일 확인 설정이 켜져 있어. Supabase의 Confirm email을 꺼줘.';
    };'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s,encoding='utf-8')

          sw=Path('service-worker.js')
          t=sw.read_text(encoding='utf-8')
          import re
          t=re.sub(r"geography-app-v(\\d+)", lambda m: f"geography-app-v{int(m.group(1))+1}", t, count=1)
          sw.write_text(t,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-username-auth.yml
          git add index.html service-worker.js .github/workflows/patch-username-auth.yml
          git commit -m "Switch login to username and password"
          git push
