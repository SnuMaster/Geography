name: Bump direct auth loaders
on:
  push:
    paths:
      - '.github/workflows/bump-direct-auth-loaders.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update direct auth loader versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\./username-auth\.js\?v=[^"\']+', './username-auth.js?v=20260820-username-v8', s)
          p.write_text(s,encoding='utf-8')
          q=Path('quiz/index.html')
          t=q.read_text(encoding='utf-8')
          t=re.sub(r'\./username-auth-override\.js\?v=[^"\']+', './username-auth-override.js?v=20260820-username-v8', t)
          q.write_text(t,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html quiz/index.html
          git diff --cached --quiet || git commit -m "Refresh direct auth loaders"
          git push
# trigger 2026-08-20-v8
