name: Prepare itinerary street data
on:
  push:
    branches: [codex/japan-offline-maps]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install extract tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool
          python3 -m pip install --user --break-system-packages 'osmium>=4,<5' 'shapely>=2,<3'
      - name: Prepare coverage polygons
        run: |
          python3 scripts/check-offline-street-build.py
          node scripts/generate-offline-street-plan.cjs /tmp/street-plan.json
          python3 scripts/build-offline-streets.py plan /tmp/street-plan.json /tmp/coverage
      - name: Download and extract OpenStreetMap data
        run: |
          set -euo pipefail
          for region in japan south-korea; do
            curl --fail --location --retry 3 --retry-delay 10 --connect-timeout 30 -o "/tmp/$region.pbf" "https://download.geofabrik.de/asia/$region-latest.osm.pbf"
            coverage=$region
            if [ "$region" = south-korea ]; then coverage=korea; fi
            osmium extract --strategy complete_ways --polygon "/tmp/coverage/$coverage.geojson" -o "/tmp/$region-small.pbf" "/tmp/$region.pbf"
            rm "/tmp/$region.pbf"
            osmium tags-filter "/tmp/$region-small.pbf" w/highway w/railway=rail,subway,tram,light_rail n/amenity -o "/tmp/$region-roads.pbf"
            rm "/tmp/$region-small.pbf"
          done
      - name: Build compressed day maps
        run: python3 scripts/build-offline-streets.py build /tmp/street-plan.json japan-2027/assets/offline-streets /tmp/japan-roads.pbf /tmp/south-korea-roads.pbf
      - name: Commit generated data to build branch
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add japan-2027/assets/offline-streets
          git commit -m 'Prepare offline itinerary street data'
          git push origin HEAD:codex/japan-offline-maps
