name: Bump service worker v31
on:
  push:
    paths:
      - '.github/workflows/bump-sw-v31.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8').replace("const APP_CACHE = 'geography-app-v30';", "const APP_CACHE = 'geography-app-v31';")
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-worker.js
          git diff --cached --quiet || git commit -m "Bump service worker cache to v31"
          git push
