name: Audit remaining fare sources
on:
  push:
    branches: [codex/tokyo-complete-fares-20261118]
    paths: ['scripts/audit-remaining-fare-sources.cjs', '.github/workflows/fare-source-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: node scripts/audit-remaining-fare-sources.cjs
      - run: python3 scripts/audit-fuji-gtfs.py
