name: Scale hardening
on:
  push:
    paths:
      - '.github/workflows/scale-hardening.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reduce Supabase load
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              "syncTimer = setTimeout(saveProgress, 0);",
              "syncTimer = setTimeout(saveProgress, immediate ? 0 : 650);"
          )

          start = s.index('    async function saveProgress() {')
          end = s.index('    async function fetchRemoteProgress()', start)
          new_save = '''    async function saveProgress() {
      if (!currentUser) return;
      if (offlinePracticeMode) {
        setSyncStatus('오프라인 연습 모드 · 이 기기에만 저장됨', 'pending');
        return;
      }
      if (!navigator.onLine) {
        setSyncStatus('오프라인 · 이 기기에 임시 저장됨', 'pending');
        return;
      }
      if (syncInFlight) {
        syncQueued = true;
        return;
      }

      syncInFlight = true;
      syncQueued = false;
      const snapshot = currentProgress();
      snapshot.user_id = currentUser.id;
      setSyncStatus('저장 중…', 'pending');

      try {
        const { data, error } = await supabaseClient.rpc('merge_my_study_progress', {
          p_snapshot: snapshot
        });
        if (error) throw error;

        applyProgress(data, '동기화된 마지막 핀');
        setSyncStatus('동기화됨 · ' + formatTime(data.updated_at), 'success');
        try { localStorage.removeItem(cacheKey('guest')); } catch {}
      } catch (error) {
        writeCache(snapshot);
        console.warn('기록 저장 실패:', error.message);
        setSyncStatus('저장 실패 · 인터넷 연결을 확인한 뒤 다시 시도해.', 'error');
      } finally {
        syncInFlight = false;
        if (syncQueued) queueSave(true);
      }
    }

'''
          s = s[:start] + new_save + s[end:]

          start = s.index('    function subscribeToProgress() {')
          end = s.index('    async function refreshFromServer()', start)
          new_subscribe = '''    function subscribeToProgress() {
      if (!currentUser || offlinePracticeMode) return;
      if (syncChannel) {
        supabaseClient.removeChannel(syncChannel);
        syncChannel = null;
      }
      stopFallbackSync();
      setSyncStatus('저부하 동기화 모드 · 변경 즉시 저장', 'success');
    }

'''
          s = s[:start] + new_subscribe + s[end:]
          p.write_text(s, encoding='utf-8')

          sw = Path('service-worker.js')
          w = sw.read_text(encoding='utf-8')
          w = w.replace("const APP_CACHE = 'geography-app-v34';", "const APP_CACHE = 'geography-app-v35';")
          sw.write_text(w, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git diff --cached --quiet || git commit -m "Reduce Supabase load for public traffic"
          git push
