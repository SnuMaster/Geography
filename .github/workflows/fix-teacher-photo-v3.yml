name: Fix teacher photo v3

on:
  push:
    paths:
      - '.github/workflows/fix-teacher-photo-v3.yml'

permissions:
  contents: write

jobs:
  fix-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact uploaded photo
        run: |
          cat .tmp/photo_chunk_*.txt > /tmp/teacher-photo.b64
          base64 -d /tmp/teacher-photo.b64 > teacher-photo-v3.webp
          echo '886aed7a655fb15d95898f1ac6231d1569536d76b99ab79662d5ccf3ee9a9e3f  teacher-photo-v3.webp' | sha256sum -c -
          test "$(stat -c%s teacher-photo-v3.webp)" = "19902"

      - name: Point site at verified image and bust cache
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if './teacher-photo-v2.svg' not in s:
              raise SystemExit('teacher-photo-v2.svg reference not found')
          s = s.replace('./teacher-photo-v2.svg', './teacher-photo-v3.webp?v=20260816-1432')
          p.write_text(s, encoding='utf-8')

          p = Path('service-worker.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("geography-app-v9", "geography-app-v10")
          s = s.replace("geography-map-tiles-v9", "geography-map-tiles-v10")
          s = s.replace("'./teacher-photo-v2.svg'", "'./teacher-photo-v3.webp?v=20260816-1432'")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit verified replacement
        run: |
          rm -f .tmp/photo_chunk_*.txt
          rm -f .github/workflows/fix-teacher-photo-v3.yml
          rmdir .tmp 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix teacher photo with verified upload'
          git push
