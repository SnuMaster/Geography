name: Fix banner quote typo

on:
  push:
    paths:
      - '.github/workflows/fix-quote-typo.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix quote typo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '대학이 점점 교회화되고 있는데..'
          new = '대학이 점점 교외화되고 있는데..'
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-quote-typo.yml
          git add -A
          git commit -m "Fix 교외화 quote typo"
          git push
