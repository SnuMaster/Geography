name: Rebuild reviewed bus routes
on:
  push:
    branches: [codex/trip-review-fixes-20261118]
    paths: ['scripts/build-reviewed-bus-geometry.cjs', '.github/workflows/build-reviewed-bus.yml']
permissions: {contents: write}
jobs:
  bus-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/build-reviewed-bus-geometry.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/tokyo-reviewed-bus-geometry.json
          git diff --cached --quiet || git commit -m "Pin six reviewed bus routes and explicit boarding walks"
          git push origin HEAD:codex/trip-review-fixes-20261118
