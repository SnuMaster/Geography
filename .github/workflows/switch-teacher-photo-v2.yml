name: Switch teacher photo v2

on:
  push:
    paths:
      - '.github/workflows/switch-teacher-photo-v2.yml'

permissions:
  contents: write

jobs:
  switch-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Switch banner image and bust cache
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = './teacher-photo.svg'
          new = './teacher-photo-v2.svg'
          if old not in text:
              raise SystemExit('teacher-photo.svg reference not found')
          index.write_text(text.replace(old, new), encoding='utf-8')

          sw = Path('service-worker.js')
          s = sw.read_text(encoding='utf-8')
          s = s.replace("geography-app-v8", "geography-app-v9")
          s = s.replace("geography-map-tiles-v8", "geography-map-tiles-v9")
          s = s.replace("'./teacher-photo.svg',", "'./teacher-photo-v2.svg',")
          sw.write_text(s, encoding='utf-8')

          wf = Path('.github/workflows/switch-teacher-photo-v2.yml')
          if wf.exists():
              wf.unlink()
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Switch banner to new teacher photo" || exit 0
          git push
